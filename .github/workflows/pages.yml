name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]      # change to master if that's your default branch
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: browser     # the folder containing your Godot web export (must have index.html)
      - id: deployment
        uses: actions/deploy-pages@v4
